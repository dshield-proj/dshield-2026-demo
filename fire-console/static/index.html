        if (lo < lonMin) lonMin = lo; if (lo > lonMax) lonMax = lo;
      }));
      const padLon = (lonMax - lonMin) * 0.08, padLat = (latMax - latMin) * 0.08;
      const proj = localProj([lonMin - padLon, lonMax + padLon, latMin - padLat, latMax + padLat], 700, 470, 10);
      svg.textContent = "";
      const gS = el("g");
      CONUS.features.forEach((ft) => gS.appendChild(el("path", { d: pathFor(ft.geometry, proj), class: "state" })));
      svg.appendChild(gS);
      const [bx1, by1] = proj(f.lon_l, f.lat_u), [bx2, by2] = proj(f.lon_u, f.lat_l);
      svg.appendChild(el("rect", {
        x: Math.min(bx1, bx2), y: Math.min(by1, by2),
        width: Math.abs(bx2 - bx1), height: Math.abs(by2 - by1),
        fill: cssv(REG[f.region].soft), stroke: col, "stroke-width": 1.8, rx: 2,
      }));
      let n = 0, nb = 0;
      const maxDi = Math.max(...need, 0);
      packs.forEach(({ di, det }) => {
        /* older days recede slightly in cumulative mode */
        const age = detailMode === "cum" ? Math.min(0.45, (maxDi - di) * 0.06) : 0;
        for (let k = 0; k < det.n; k++) {
          const [dx, dy] = proj(det.lon[k], det.lat[k]);
          if (dx < 0 || dx > 700 || dy < 0 || dy > 470) continue;
          n++;
          if (det.y[k]) {
            nb++;
            svg.appendChild(el("circle", { cx: dx, cy: dy, r: 3.4, fill: cssv("--burn"), opacity: Math.max(0.15, dotOpacity(det.u[k]) - age), class: "det-dot" }));
          } else {
            svg.appendChild(el("circle", { cx: dx, cy: dy, r: 2.6, fill: "none", stroke: cssv("--muted"), "stroke-width": 1.1, opacity: Math.max(0.12, 0.55 - age), class: "det-dot" }));
          }
        }
      });
      const scope = detailMode === "cum" ? `through ${fmtShort(B.dates[cur])}` : fmtShort(B.dates[cur]);
      document.getElementById("det-stat").innerHTML = n
        ? `${scope}: ${n} obs · <b>${nb} burned</b> (${Math.round(100 * nb / n)}%)`
        : `${scope}: no detections`;
    });
  }

  /* ================= playback / keys ================= */
  function syncPlayUI() {
    if (!ui.playBtn) return;
    ui.playLbl.textContent = playing ? "Pause" : "Play";
    ui.playBtn.querySelector(".gl").innerHTML = playing
      ? '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>'
      : '<polygon points="6,4 20,12 6,20"/>';
    ui.playBtn.setAttribute("aria-label", playing ? "Pause timeline" : "Play timeline");
  }
  function setPlay(on) {
    playing = on;
    syncPlayUI();
    if (timer) { clearInterval(timer); timer = null; }
    if (on) timer = setInterval(() => setDay(cur >= B.dates.length - 1 ? 0 : cur + 1), stepMs);
  }
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { closeDetail(); return; }
    if (detailFireId) return;
    if (e.key === "ArrowRight") { setPlay(false); setDay(cur + 1); }
    else if (e.key === "ArrowLeft") { setPlay(false); setDay(cur - 1); }
    else if (e.key === " " || e.code === "Space") { e.preventDefault(); setPlay(!playing); }
  });

  /* ================= live sync ================= */
  let version = null;
  function setLive(ok, msg) {
    const lv = document.getElementById("live");
    if (!lv) return;
    lv.classList.toggle("err", !ok);
    document.getElementById("live-txt").textContent = msg;
  }
  async function poll() {
    try {
      const v = await api("/api/version");
      if (v.version !== version) {
        version = v.version;
        const keepDate = B ? B.dates[cur] : null;
        B = await api("/api/bundle");
        detCache.clear();
        rawifCache.clear();
        buildAll();
        const idx = keepDate ? B.dates.indexOf(keepDate) : 0;
        cur = idx >= 0 ? idx : Math.min(cur, B.dates.length - 1);
        ui.scrub.value = String(cur);
        render();
        prefetchDanger();
        prefetchSoil();
        prefetchRawif();
        if (playing) setPlay(true);
      }
      setLive(true, "live · synced " + new Date().toLocaleTimeString());
    } catch (err) {
      setLive(false, "connection lost — retrying");
    }
  }

  /* ================= boot ================= */
  (async function boot() {
    try {
      const [conus, bundle] = await Promise.all([api("/static/conus.json"), api("/api/bundle")]);
      CONUS = conus; B = bundle; version = bundle.version;
      if (!B.dates.length) {
        document.getElementById("boot").textContent = "no day folders found on disk — check FIRE_CONFIG_ROOT";
        return;
      }
      buildAll();
      setDay(0);
      prefetchDanger();
      prefetchSoil();
      prefetchRawif();
      setLive(true, "live · synced " + new Date().toLocaleTimeString());
      setInterval(poll, 5000);
    } catch (err) {
      const b = document.getElementById("boot");
      b.classList.add("err");
      b.textContent = "failed to reach data server: " + err.message;
    }
  })();
})();
</script>
</body>
</html>
